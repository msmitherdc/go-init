# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Nothing here writes to the repository, so drop the default token down to
# read-only.
permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    # Actions are pinned to a commit SHA so that a moved tag cannot change
    # what runs here. The trailing comment records the readable version.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'

    - name: Check formatting
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race -v ./...

    - name: Check for known vulnerabilities
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
        "$(go env GOPATH)/bin/govulncheck" ./...

    - name: Build Image
      run: docker build -t localhost/go-init -f ./Containerfile .
